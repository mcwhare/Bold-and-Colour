<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 20px;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  input {
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
  }
  button {
    padding: 8px 16px;
    background-color: #18A0FB;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
  }
  button:hover {
    background-color: #0D8DE2;
  }
</style>

<div>
  <label for="color">Enter color:</label>
</div>
<input type="text" id="color" placeholder="#FFFFFF" value="#FFFFFF" />
<button id="apply">Apply Color</button>

<script>
  document.getElementById('apply').onclick = () => {
    const colorInput = document.getElementById('color').value;
    // Send the color value back to the main plugin code
    parent.postMessage({ pluginMessage: { type: 'apply-color', color: colorInput } }, '*');
  };
</script>
